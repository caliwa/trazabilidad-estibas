# /etc/nginx/sites-available/trazabilidad
# Reemplazar estibas.example.com y las rutas del certificado.

server {
    listen 80;
    listen [::]:80;
    server_name estibas.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name estibas.example.com;

    # Solo public/ de la versión activa. .env, storage, vendor y el código quedan fuera.
    root /var/www/trazabilidad/current/public;
    index index.php;

    ssl_certificate     /etc/ssl/certs/estibas.crt;
    ssl_certificate_key /etc/ssl/private/estibas.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    # La aplicación envía X-Content-Type-Options, X-Frame-Options,
    # Referrer-Policy, Permissions-Policy y HSTS (middleware SecurityHeaders).
    server_tokens off;
    charset utf-8;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets de Vite con hash en el nombre.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Solo index.php se ejecuta. Cualquier otro .php devuelve 404.
    location = /index.php {
        fastcgi_pass unix:/run/php/trazabilidad.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }

    # Archivos ocultos (.env, .git, .htaccess), salvo .well-known para certificados.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
