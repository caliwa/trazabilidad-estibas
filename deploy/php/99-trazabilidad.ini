; /etc/php/8.3/fpm/conf.d/99-trazabilidad.ini y /etc/php/8.3/cli/conf.d/99-trazabilidad.ini
expose_php = Off
display_errors = Off
log_errors = On
date.timezone = America/Bogota

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
; Con despliegue por symlink, PHP-FPM se recarga en cada despliegue (deploy.sh).
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
