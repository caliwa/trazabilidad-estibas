; /etc/php/8.3/fpm/pool.d/trazabilidad.conf
; Pool propio, con su usuario y su socket.

[trazabilidad]
user = trazabilidad
group = trazabilidad
listen = /run/php/trazabilidad.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

request_terminate_timeout = 65s
catch_workers_output = yes
decorate_workers_output = no

; Los errores van al log, nunca a la respuesta.
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php/trazabilidad-fpm.log
php_admin_value[memory_limit] = 256M
php_admin_flag[expose_php] = off
php_admin_value[upload_max_filesize] = 2M
php_admin_value[post_max_size] = 2M
php_admin_value[session.cookie_secure] = 1
php_admin_value[session.cookie_httponly] = 1
