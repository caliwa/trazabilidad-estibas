; /etc/supervisor/conf.d/trazabilidad-lectores.conf
;
; Un programa por lector fijo de cajas. Copiar el bloque, cambiar el código
; del lector (registrado con devices:register ... --kind=LECTOR) y la forma
; de conexión:
;   --connect=IP:PUERTO  el lector es el servidor TCP (lo más común)
;   --listen=IP:PUERTO   el lector es el cliente TCP y se conecta a este servidor
;   --serial=/dev/ttyUSB0 --baud=9600  el lector está conectado por serial a este equipo
; Reconecta solo. stopsignal=TERM deja terminar la lectura en curso.

[program:trazabilidad-lector-lec-l1]
command=/usr/bin/php /var/www/trazabilidad/current/artisan boxes:reader LEC-L1 --connect=192.168.1.50:23
user=trazabilidad
numprocs=1
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=15
redirect_stderr=true
stdout_logfile=/var/www/trazabilidad/shared/storage/logs/lector-lec-l1.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
