; /etc/supervisor/conf.d/trazabilidad.conf
;
; Dos workers separados: un envío lento a SAP no frena correos ni avisos.
; --timeout (75 s) es mayor que dos llamadas a SAP (SAP_SL_TIMEOUT=30, Service Layer) y menor
; que DB_QUEUE_RETRY_AFTER (90 s), así un job lento nunca lo toma otro worker.
; stopwaitsecs deja terminar el job en curso antes de matar el proceso.

[program:trazabilidad-sap]
command=/usr/bin/php /var/www/trazabilidad/current/artisan queue:work database --queue=sap --sleep=3 --tries=1 --timeout=75 --max-time=3600
user=trazabilidad
numprocs=1
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=/var/www/trazabilidad/shared/storage/logs/worker-sap.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[program:trazabilidad-default]
command=/usr/bin/php /var/www/trazabilidad/current/artisan queue:work database --queue=default --sleep=3 --tries=3 --timeout=60 --max-time=3600
user=trazabilidad
numprocs=1
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=70
redirect_stderr=true
stdout_logfile=/var/www/trazabilidad/shared/storage/logs/worker-default.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5

[group:trazabilidad]
programs=trazabilidad-sap,trazabilidad-default
